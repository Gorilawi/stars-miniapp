<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>StarsShop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0e16;--card:#131a28;--card2:#1a2233;--line:#212a3d;--txt:#f2f5fa;--hint:#8792a6;--blue:#4d8dff;--blue2:#6a5cff;--gold:#ffc857;--green:#3ddc84;--danger:#ff6b70}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
body{max-width:460px;margin:0 auto;min-height:100vh;padding:calc(10px + env(safe-area-inset-top)) 0 calc(78px + env(safe-area-inset-bottom))}
.press{transition:transform .12s}.press:active{transform:scale(.95)}
::-webkit-scrollbar{display:none}

.top{display:flex;align-items:center;gap:8px;padding:0 12px 10px}
.logo{font-weight:900;font-size:18px;letter-spacing:-.5px}
.logo span{color:var(--blue)}
.tabsrow{display:flex;gap:6px;overflow-x:auto;flex:1;padding:0 2px}
.ttab{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.ttab.on{background:var(--blue);border-color:var(--blue);color:#fff}

.bwrap{margin:0 12px 14px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#2a1f66,#141b33);padding:18px;min-height:110px}
.btag{display:inline-block;background:#ffffff22;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px;margin-bottom:8px}
.bwrap h3{font-size:20px;font-weight:900;line-height:1.15}
.bwrap p{font-size:12px;color:#c9d2e3;margin-top:5px;max-width:78%}

section{padding:0 12px;margin-bottom:18px}
.srow{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:14.5px;font-weight:800}
.muted{color:var(--hint);font-size:12.5px}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center;position:relative}
.sc.pop{border-color:var(--blue)}
.sc .badge{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:var(--blue);font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
.sc svg{width:24px;height:24px;margin-bottom:4px}
.sc b{font-size:13px;display:block}
.sc .pr{font-size:10.5px;color:var(--hint);margin-top:2px}

.plist{display:flex;flex-direction:column;gap:7px}
.pl{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;position:relative}
.pl.rec{border-color:var(--gold)}
.pl svg{width:26px;height:26px;flex-shrink:0}
.pl .pi{flex:1}
.pl .pi b{font-size:13px}
.pl .pi span{font-size:10.5px;color:var(--hint);display:block}
.pl .pp{font-weight:800;font-size:13px}
.pl .rt{position:absolute;top:-7px;right:10px;background:var(--gold);color:#241d10;font-size:8px;font-weight:800;padding:2px 7px;border-radius:99px}

.stats2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.stile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stile b{font-size:17px;display:block}
.stile span{font-size:11px;color:var(--hint)}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.hrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.hrow:last-child{border:none}
.hic{font-size:17px;width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hmid{flex:1;min-width:0}
.hmid .t1{font-size:13.5px;font-weight:600}
.hst{font-size:11.5px;font-weight:700}
.hst.done{color:var(--green)}.hst.failed,.hst.expired,.hst.cancelled{color:var(--danger)}.hst.pending,.hst.paid,.hst.delivering{color:var(--blue)}

.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;display:flex;background:rgba(10,14,22,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 4px calc(5px + env(safe-area-inset-bottom));z-index:5}
.tab{flex:1;background:none;border:none;color:var(--hint);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-family:inherit}
.tab.on{color:var(--blue)}
.tab svg{width:19px;height:19px}

.sheet-bg{position:fixed;inset:0;background:rgba(3,5,9,.65);z-index:30;display:none;align-items:flex-end;opacity:0;transition:opacity .25s}
.sheet-bg.show{display:flex;opacity:1}
.sheet{width:100%;max-width:460px;margin:0 auto;background:#0d1220;border:1px solid var(--line);border-top-left-radius:22px;border-top-right-radius:22px;padding:12px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.show .sheet{transform:translateY(0)}
.grab{width:36px;height:4px;background:var(--line);border-radius:9px;margin:0 auto 14px}
.shead{text-align:center;margin-bottom:14px}
.shead .im{width:70px;height:70px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.shead .im svg{width:100%;height:100%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.shead b{font-size:16.5px;display:block}
.shead span{font-size:12.5px;color:var(--hint)}
input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:#fff;font-size:14px;margin-bottom:10px}
.srows{background:var(--card);border-radius:13px;padding:2px 13px;margin-bottom:12px}
.rr{display:flex;justify-content:space-between;padding:9px 0;font-size:13px;border-bottom:1px solid var(--line)}
.rr:last-child{border:none}
.rr span:first-child{color:var(--hint)}
.paymeth{display:flex;gap:8px;margin-bottom:14px}
.pm{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;font-weight:600}
.pm.on{border-color:var(--blue);color:var(--blue)}
.buy{width:100%;background:linear-gradient(135deg,var(--blue),var(--blue2));border:none;border-radius:13px;padding:14px;color:#fff;font-size:15px;font-weight:800}
.buy:active{transform:scale(.98)}
.buy:disabled{opacity:.5}
.sec{background:var(--card2);color:#fff}
.danger{background:var(--card2);color:var(--danger)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:14px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center;padding:40px 16px}
.center .big{font-size:48px;margin-bottom:10px}
.center p{color:var(--hint);font-size:13.5px;margin:6px 0 16px}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-20px);background:#1a2233;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.nochrome .tabs{display:none}
</style></head>
<body>
<div class="top"><div class="logo">Stars<span>Shop</span></div>
 <div class="tabsrow" id="ttabs">
  <div class="ttab on" data-t="stars">⭐ Stars</div>
  <div class="ttab" data-t="premium">👑 Premium</div>
  <div class="ttab" data-t="profile">👥 Бонусы</div>
 </div>
</div>
<main id="view"><div class="spin"></div></main>
<nav class="tabs">
 <button class="tab on" data-t="stars"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.6L21 9.3l-5 4.5 1.4 6.9L12 17.3l-5.4 3.4L8 13.8 3 9.3l6.4-.7z"/></svg>Stars</button>
 <button class="tab" data-t="premium"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4 3 5-7 5 7 4-3-2 11H5L3 8z"/></svg>Premium</button>
 <button class="tab" data-t="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="18" cy="9" r="2.5"/><path d="M15 20c.3-2.3 2-4 4.5-4"/></svg>Бонусы</button>
 <button class="tab" data-t="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>Заказы</button>
</nav>
<div class="sheet-bg" id="shBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const API_BASE = '';
const tg = window.Telegram && window.Telegram.WebApp;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('ru-RU');
const usd = n => Number(n).toFixed(2);

let cfg=null, me=null, tab='stars', pollTimer=null;
const TITLES={stars:'StarsShop',premium:'StarsShop',profile:'StarsShop',orders:'StarsShop'};
const STATUS={pending:['⏳','Ждёт оплаты'],paid:['💰','Оплачен'],delivering:['📤','Отправляем'],done:['✅','Выполнен'],failed:['❌','Ошибка'],expired:['⌛','Истёк'],cancelled:['🚫','Отменён']};
const FINAL=['done','failed','expired','cancelled'];

if (tg){ tg.ready(); tg.expand(); }
function openLink(url){ if (tg && /^https:\/\/t\.me\//.test(url) && tg.openTelegramLink) tg.openTelegramLink(url); else if (tg && tg.openLink) tg.openLink(url); else window.open(url,'_blank'); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2800); }
function showSheet(html){ $('sheet').innerHTML='<div class="grab"></div>'+html; $('shBg').classList.add('show'); }
function closeSheet(){ clearInterval(pollTimer); $('shBg').classList.remove('show'); }
$('shBg').addEventListener('click', e=>{ if (e.target===$('shBg')) closeSheet(); });

async function api(path, body){
  const opt = {method: body===undefined?'GET':'POST', headers:{'Authorization':'tma '+(tg?tg.initData:'')}};
  if (body!==undefined){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  let r; try { r = await fetch(API_BASE+path, opt); } catch(e){ throw {code:'network', message:'Нет связи с сервером'}; }
  let j={}; try { j = await r.json(); } catch(e){}
  if (!r.ok || j.ok===false){ const err={code:j.error||('http_'+r.status), message:j.message||'Ошибка сервера'}; if (err.code==='not_subscribed') showGate(); throw err; }
  return j;
}

/* icons */
let gid=0;
const starSVG=()=>{const id='g'+(gid++);return `<svg viewBox="0 0 24 24"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff9d2b"/></linearGradient></defs><path fill="url(#${id})" d="M12 2l2.6 6.6L21 9.3l-5 4.5 1.4 6.9L12 17.3l-5.4 3.4L8 13.8 3 9.3l6.4-.7z"/></svg>`;};
const crownSVG=()=>{const id='g'+(gid++);return `<svg viewBox="0 0 24 24"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3c9ff"/><stop offset="1" stop-color="#8a5cff"/></linearGradient></defs><path fill="url(#${id})" d="M3 8l4 3 5-7 5 7 4-3-2 11H5L3 8z"/></svg>`;};

function setTab(t){
  tab=t;
  document.querySelectorAll('.tab,.ttab').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  ({stars:viewStars,premium:viewPremium,profile:viewProfile,orders:viewOrders})[t]();
  window.scrollTo(0,0);
}
document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.t)));

function showGate(){
  document.body.classList.add('nochrome'); closeSheet();
  const url=(cfg&&cfg.channel_url)||'';
  $('view').innerHTML='<div class="center"><div class="big">📢</div><b style="font-size:17px">Подпишитесь на канал</b>'+
    '<p>Чтобы пользоваться магазином, подпишитесь на канал и нажмите «Проверить подписку».</p>'+
    (url?'<button class="buy press" id="gSub" style="margin-bottom:8px">Открыть канал</button>':'')+
    '<button class="buy sec press" id="gChk">Проверить подписку</button></div>';
  if (url) $('gSub').addEventListener('click',()=>openLink(url));
  $('gChk').addEventListener('click', async()=>{
    try{ const r=await api('/api/me',{}); me=r.me; if (me.subscribed){ document.body.classList.remove('nochrome'); setTab('stars'); } else toast('Подписка пока не найдена'); }
    catch(e){ toast(e.message); }
  });
}

/* Stars */
function viewStars(){
  let h = `<div class="bwrap"><span class="btag">Telegram Stars</span><h3>Отправим звёзды<br>прямо на ваш аккаунт</h3><p>Оплата в CryptoBot или по СБП</p></div>`;
  h += '<section><div class="srow">⭐ Пакеты</div><div class="grid3">'+
    cfg.packs.map(p=>`<div class="sc${p.amount===500?' pop':''} press" data-a="${p.amount}">${p.amount===500?'<div class="badge">ХИТ</div>':''}${starSVG()}<b>${fmt(p.amount)}</b><div class="pr">${usd(p.usdt)} USDT</div></div>`).join('')+
    '</div><div class="srow" style="margin-top:16px">Своё количество</div>'+
    `<input type="text" id="cust" inputmode="numeric" placeholder="От ${cfg.star_min} до ${fmt(cfg.star_max)}">`+
    '<div class="muted" id="custHint" style="margin:-4px 0 10px"></div>'+
    '<button class="buy press" id="goStars">Оформить</button></section>';
  $('view').innerHTML=h;
  document.querySelectorAll('.sc[data-a]').forEach(el=>el.addEventListener('click',()=>openCheckout({product:'stars',amount:+el.dataset.a})));
  let qTimer;
  $('cust').addEventListener('input', ()=>{
    clearTimeout(qTimer); const n=parseInt($('cust').value,10); const hint=$('custHint');
    if (!$('cust').value){ hint.textContent=''; return; }
    if (!(n>=cfg.star_min && n<=cfg.star_max)){ hint.textContent='От '+cfg.star_min+' до '+fmt(cfg.star_max); return; }
    hint.textContent='Считаем…';
    qTimer=setTimeout(async()=>{ try{ const q=await api('/api/quote',{product:'stars',amount:n}); hint.textContent='≈ '+usd(q.usdt)+' USDT'; }catch(e){ hint.textContent=e.message; } },350);
  });
  $('goStars').addEventListener('click', ()=>{ const n=parseInt($('cust').value,10)||500; if (!(n>=cfg.star_min&&n<=cfg.star_max)) return toast('Введите корректное количество'); openCheckout({product:'stars',amount:n}); });
}

/* Premium */
function viewPremium(){
  const base=cfg.premium[0].usdt/cfg.premium[0].months;
  let h=`<div class="bwrap"><span class="btag">Telegram Premium</span><h3>До 12 мес.<br>со скидкой</h3><p>Без рекламы, расширенные лимиты</p></div>`;
  h+='<section><div class="srow">👑 Тарифы</div><div class="plist">'+
    cfg.premium.map(p=>{ const per=p.usdt/p.months, save=Math.round((1-per/base)*100), rec=p.months===12;
      return `<div class="pl${rec?' rec':''} press" data-m="${p.months}">${rec?'<div class="rt">ВЫГОДНО</div>':''}${crownSVG()}<div class="pi"><b>${p.months} мес.</b>${save>0?' <span class="muted">(−'+save+'%)</span>':''}<span>${usd(per)} USDT/мес</span></div><div class="pp">${usd(p.usdt)} USDT</div></div>`; }).join('')+
    '</div></section>';
  $('view').innerHTML=h;
  document.querySelectorAll('.pl[data-m]').forEach(el=>el.addEventListener('click',()=>openCheckout({product:'premium',months:+el.dataset.m})));
}

/* checkout */
let method='crypto';
function methRow(){
  const rows=cfg.methods.map(m=>{ const o=m==='crypto'?['🪙','CryptoBot']:['🏦','СБП / карта']; return `<div class="pm${method===m?' on':''}" data-m="${m}">${o[0]} ${o[1]}</div>`; }).join('');
  return `<div class="paymeth">${rows}</div>`;
}
async function openCheckout(item){
  const title = item.product==='stars' ? fmt(item.amount)+' Stars' : 'Premium · '+item.months+' мес.';
  showSheet('<div class="spin"></div>');
  let q; try{ q=await api('/api/quote',item); }catch(e){ closeSheet(); toast(e.message); return; }
  if (method!=='crypto' && cfg.methods.indexOf(method)<0) method=cfg.methods[0];
  let uname = me.username||'';
  const draw=()=>{
    showSheet(`<div class="shead"><div class="im">${item.product==='stars'?starSVG():crownSVG()}</div><b>${esc(title)}</b><span>${usd(q.usdt)} USDT · ≈ ${fmt(q.rub)} ₽</span></div>`+
      `<div class="srow" style="font-size:13px;margin-bottom:6px">Username получателя</div>`+
      `<input type="text" id="uName" placeholder="username без @" value="${esc(uname)}" maxlength="33" autocapitalize="off" autocomplete="off" spellcheck="false">`+
      `<div class="muted" style="margin:-4px 0 12px">Товар придёт на этот аккаунт</div>`+
      methRow()+
      `<button class="buy press" id="payBtn">Оплатить · ${usd(q.usdt)} USDT</button>`);
    $('uName').addEventListener('input', e=>{ uname=e.target.value; });
    document.querySelectorAll('.pm').forEach(el=>el.addEventListener('click',()=>{ method=el.dataset.m; draw(); }));
    $('payBtn').addEventListener('click', pay);
  };
  const pay=async()=>{
    const u=uname.trim().replace(/^@/,'');
    if (!/^[A-Za-z0-9_]{5,32}$/.test(u)) return toast('Username: 5–32 символа, латиница/цифры/_');
    $('payBtn').disabled=true;
    try{ const r=await api('/api/order', Object.assign({},item,{username:u, method})); openLink(r.order.pay_url); showOrder(r.order.id, r.order); }
    catch(e){ toast(e.message); $('payBtn').disabled=false; }
  };
  draw();
}

async function showOrder(id, first){
  clearInterval(pollTimer); let o=first;
  if (!o){ showSheet('<div class="spin"></div>'); try{ o=(await api('/api/order/'+id)).order; }catch(e){ closeSheet(); toast(e.message); return; } }
  const draw=()=>{
    let body;
    if (o.status==='pending') body=`<div class="spin"></div><b style="display:block;text-align:center;font-size:16px">Ждём оплату</b><p class="muted" style="text-align:center;margin:6px 0 16px">Страница обновится сама</p><button class="buy press" id="oOpen" style="margin-bottom:8px">Открыть счёт</button><button class="buy danger press" id="oCancel">Отменить заказ</button>`;
    else if (o.status==='paid'||o.status==='delivering') body=`<div class="spin"></div><b style="display:block;text-align:center;font-size:16px">Оплата получена</b><p class="muted" style="text-align:center">Отправляем товар…</p>`;
    else if (o.status==='done') body=`<div class="center" style="padding:6px"><div class="big">✅</div><b style="font-size:17px">Готово!</b><p>${esc(o.title)} → @${esc(o.username)}</p><button class="buy press" id="oOk">Отлично</button></div>`;
    else if (o.status==='failed') body=`<div class="center" style="padding:6px"><div class="big">❌</div><b style="font-size:17px">Доставка не удалась</b><p>Оплата прошла, но товар не отправился. Заказ ${esc(o.id)}</p><button class="buy sec press" id="oOk">Закрыть</button></div>`;
    else body=`<div class="center" style="padding:6px"><div class="big">${STATUS[o.status][0]}</div><b style="font-size:17px">${STATUS[o.status][1]}</b><button class="buy sec press" id="oOk">Закрыть</button></div>`;
    showSheet(`<div class="muted" style="text-align:center;margin-bottom:6px">${esc(o.title)} → @${esc(o.username)}</div>`+body);
    if ($('oOpen')) $('oOpen').addEventListener('click',()=>openLink(o.pay_url));
    if ($('oOk')) $('oOk').addEventListener('click',closeSheet);
    if ($('oCancel')) $('oCancel').addEventListener('click', async()=>{ try{ o=(await api('/api/order/'+o.id+'/cancel',{})).order; clearInterval(pollTimer); draw(); }catch(e){ toast(e.message); } });
  };
  draw();
  if (FINAL.indexOf(o.status)>=0) return;
  pollTimer=setInterval(async()=>{ try{ const prev=o.status; o=(await api('/api/order/'+id)).order; if (o.status!==prev) draw(); if (FINAL.indexOf(o.status)>=0) clearInterval(pollTimer); }catch(e){} },3000);
}

/* бонусы (реферальная программа) */
function viewProfile(){
  $('view').innerHTML=`<section><div class="srow">👥 Реферальная программа</div><div class="stats2">`+
    `<div class="stile"><span>Бонусный баланс</span><b>⭐ ${fmt(me.bonus)}</b></div>`+
    `<div class="stile"><span>Приглашено</span><b>${fmt(me.invited)}</b></div></div>`+
    `<div class="muted" style="margin-top:4px">За каждую оплату друга вы получаете бонусные ⭐</div>`+
    `<div class="linkbox">${esc(me.ref_link)}</div>`+
    `<div class="two"><button class="buy sec press" id="rCopy">Копировать</button><button class="buy press" id="rShare">Поделиться</button></div></section>`;
  $('rCopy').addEventListener('click', async()=>{ try{ await navigator.clipboard.writeText(me.ref_link); toast('Ссылка скопирована'); }catch(e){ toast('Скопируйте вручную'); } });
  $('rShare').addEventListener('click', ()=>openLink('https://t.me/share/url?url='+encodeURIComponent(me.ref_link)+'&text='+encodeURIComponent('StarsShop — Stars и Premium')));
}

/* заказы */
async function viewOrders(){
  $('view').innerHTML='<section><div class="srow">🧾 Мои заказы</div><div id="hist"><div class="spin"></div></div></section>';
  let list=[]; try{ list=(await api('/api/orders')).orders; }catch(e){ $('hist').innerHTML='<div class="muted">'+esc(e.message)+'</div>'; return; }
  if (tab!=='orders') return;
  if (!list.length){ $('hist').innerHTML='<div class="muted">Пока нет заказов</div>'; return; }
  $('hist').innerHTML=list.map(o=>{ const st=STATUS[o.status]||['•',o.status]; const d=new Date(o.created*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<div class="hrow" data-id="${esc(o.id)}"><div class="hic">${st[0]}</div><div class="hmid"><div class="t1">${esc(o.title)}</div><div class="muted">@${esc(o.username)} · ${d}</div></div><div class="hst ${esc(o.status)}">${st[1]}</div></div>`; }).join('');
  document.querySelectorAll('.hrow').forEach(el=>el.addEventListener('click',()=>showOrder(el.dataset.id)));
}

async function boot(){
  if (!tg || !tg.initData){ document.body.classList.add('nochrome'); $('view').innerHTML='<div class="center"><div class="big">📱</div><b style="font-size:17px">Откройте через Telegram</b><p>Этот мини-апп работает только внутри Telegram — откройте его кнопкой «Магазин» в боте.</p></div>'; return; }
  try{ const res=await Promise.all([api('/api/config'), api('/api/me',{})]); cfg=res[0].config; me=res[1].me; }
  catch(e){ if (e.code==='not_subscribed') return; document.body.classList.add('nochrome'); $('view').innerHTML='<div class="center"><div class="big">⚠️</div><b style="font-size:17px">Не удалось загрузить</b><p>'+esc(e.message)+'</p><button class="buy press" id="retry">Повторить</button></div>'; $('retry').addEventListener('click',()=>location.reload()); return; }
  if (!me.subscribed){ showGate(); return; }
  setTab('stars');
}
boot();
})();
</script>
