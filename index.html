<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stars Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#121218; color:#fff; padding:12px 12px 86px; }
    .top { display:flex; justify-content:space-between; align-items:center; }
    .muted { color:#9aa0b4; font-size:13px; }
    .fill { background:#7b5cff; color:#fff; border:0; border-radius:14px; padding:10px 14px; font-weight:700; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .card { background:#1c1c24; border:0; border-radius:18px; padding:12px; color:#fff; text-align:left; }
    .page { display:none; }
    .page.on { display:block; }
    input { width:100%; box-sizing:border-box; margin:8px 0; padding:12px; border:0; border-radius:12px; background:#101018; color:#fff; }
    .nav { position:fixed; left:0; right:0; bottom:0; background:#18181f; display:flex; padding:8px 0 12px; }
    .nav button { flex:1; border:0; background:none; color:#9aa0b4; }
    .nav button.on { color:#fff; }
    .ico { width:52px; height:52px; border-radius:14px; background:#2a2a32; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
    .nav .ico { width:28px; height:28px; margin:0 auto 4px; background:transparent; }
    svg { width:26px; height:26px; fill:#d7d7de; }
    .nav svg { width:20px; height:20px; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <div class="muted">Магазин</div>
      <b>Stars Shop</b>
    </div>
    <button class="fill" id="to-shop">Купить Stars</button>
  </div>

  <div id="home" class="page on">
    <div class="grid">
      <div class="card">
        <div class="ico" id="i-bag"></div>
        <b>Gift Case</b>
        <div class="muted">59 ⭐</div>
        <button class="fill" id="open-case" style="width:100%;margin-top:10px">Открыть</button>
      </div>
      <div class="card">
        <div class="ico" id="i-star"></div>
        <b>Stars</b>
        <div class="muted">покупка за крипту</div>
        <button class="fill" id="to-shop-2" style="width:100%;margin-top:10px">Купить</button>
      </div>
    </div>
  </div>

  <div id="shop" class="page">
    <div class="grid">
      <button class="card" data-stars="50"><div class="ico starbox"></div><b>50 Stars</b><div class="muted">0.88 USDT</div></button>
      <button class="card" data-stars="100"><div class="ico starbox"></div><b>100 Stars</b><div class="muted">1.75 USDT</div></button>
      <button class="card" data-stars="250"><div class="ico starbox"></div><b>250 Stars</b><div class="muted">4.38 USDT</div></button>
      <button class="card" data-prem="3"><div class="ico bagbox"></div><b>Premium 3</b><div class="muted">14.90 USDT</div></button>
    </div>
    <input id="custom" type="number" placeholder="Своё количество Stars">
    <input id="username" placeholder="username получателя">
    <button class="fill" id="pay-shop" style="width:100%">Оплатить криптой</button>
  </div>

  <div class="nav">
    <button id="n1" class="on"><div class="ico" id="n-home"></div>Главная</button>
    <button id="n2"><div class="ico" id="n-star"></div>Stars</button>
    <button id="n3"><div class="ico" id="n-bag"></div>Кейсы</button>
  </div>

  <script>
    const homeSvg = '<svg viewBox="0 0 24 24"><path d="M12 4 4 11h2v8h5v-6h2v6h5v-8h2z"/></svg>';
    const starSvg = '<svg viewBox="0 0 24 24"><path d="M12 3l2.6 6.3L21 10l-4.5 4.1L17.8 21 12 17.6 6.2 21l1.3-6.9L3 10l6.4-.7z"/></svg>';
    const bagSvg = '<svg viewBox="0 0 24 24"><path d="M8 7V6a4 4 0 0 1 8 0v1h3v13H5V7h3zm2 0h4V6a2 2 0 0 0-4 0v1z"/></svg>';
    document.getElementById("i-bag").innerHTML = bagSvg;
    document.getElementById("i-star").innerHTML = starSvg;
    document.getElementById("n-home").innerHTML = homeSvg;
    document.getElementById("n-star").innerHTML = starSvg;
    document.getElementById("n-bag").innerHTML = bagSvg;
    document.querySelectorAll(".starbox").forEach(el => el.innerHTML = starSvg);
    document.querySelectorAll(".bagbox").forEach(el => el.innerHTML = bagSvg);

    const BOT_USERNAME = "Frckwqstarts_bot";
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    let order = { product: "stars", amount: 50 };
    function show(id) {
      document.getElementById("home").classList.toggle("on", id === "home");
      document.getElementById("shop").classList.toggle("on", id === "shop");
      document.getElementById("n1").classList.toggle("on", id === "home");
      document.getElementById("n2").classList.toggle("on", id === "shop");
      document.getElementById("n3").classList.toggle("on", id === "home");
    }
    function go(start) {
      const url = "https://t.me/" + BOT_USERNAME + "?start=" + start;
      if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
      else window.location.href = url;
    }
    document.getElementById("n1").onclick = () => show("home");
    document.getElementById("n2").onclick = () => show("shop");
    document.getElementById("n3").onclick = () => show("home");
    document.getElementById("to-shop").onclick = () => show("shop");
    document.getElementById("to-shop-2").onclick = () => show("shop");
    document.getElementById("open-case").onclick = () => go("c_gift_me");
    document.querySelectorAll("#shop .card").forEach(btn => {
      btn.onclick = () => {
        if (btn.dataset.stars) order = { product: "stars", amount: Number(btn.dataset.stars) };
        else order = { product: "premium", months: Number(btn.dataset.prem) };
      };
    });
    document.getElementById("pay-shop").onclick = () => {
      const custom = Number(document.getElementById("custom").value);
      if (custom) {
        if (custom < 50) return alert("Минимум 50 Stars");
        order = { product: "stars", amount: custom };
      }
      const username = document.getElementById("username").value.trim().replace("@", "");
      if (!username) return alert("Напиши username");
      if (order.product === "premium") go("p_" + order.months + "_" + username);
      else go("s_" + order.amount + "_" + username);
    };
  </script>
</body>
</html>
